name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values only; the test suite uses a fake LLM client and never calls a real API.
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: dummy-ci-key
      GOOGLE_API_KEY: dummy-ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
